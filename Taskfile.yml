# Taskfile for NextUI on Alpine.
#
# The entry point for every build and check in this repo. `make` is still the
# tool that compiles the NextUI payload -- the per-component makefiles in
# workspace/ are deeply idiomatic and rewriting them buys nothing -- but you
# should not have to know that to build a release. Everything you type is
# `task <name>`.
#
# Modelled on Minime's Justfile, reduced to what this fork actually has.
#
# Two things live here that used to be duplicated across the makefile, the CI
# matrix and the trait registry:
#   * the board list (h700, rk3566)
#   * the fact that the build is Alpine + panfrost only
# Both are now derived, not declared, wherever it is cheap to derive them.

version: '3'

vars:
  # Release matrix, in order. Kept explicit rather than globbed so the CI matrix
  # and the local default cannot drift; `task boards` cross-checks this against
  # the trait registry, which is the real source of truth.
  BOARDS: 'h700 rk3566'
  BOARDS_1: 'h700'
  MAKE: make

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  # ── Boards ────────────────────────────────────────────────────────────────

  boards:
    desc: List supported boards and the DTBs each one must ship
    cmds:
      - |
        set -eu
        for b in {{.BOARDS}}; do
          echo "board: $b"
          ./alpine/boards/gentraits.sh dtbs "$b" | sed 's/^/  dtb /'
        done

  devices:
    desc: List every device in the trait registry, per board
    cmds:
      - |
        set -eu
        for b in {{.BOARDS}}; do
          echo "board: $b"
          for f in workspace/alpine/boards/$b/traits/devices/*.ini; do
            [ -f "$f" ] || continue
            id=$(sed -n 's/^device_id=//p' "$f" | head -n1)
            model=$(sed -n 's/^device_model=//p' "$f" | head -n1)
            parent=$(sed -n 's/^parent=//p' "$f" | head -n1)
            [ -z "$parent" ] || parent=" (inherits $parent)"
            printf '  %-16s %s%s\n' "$id" "$model" "$parent"
          done
        done

  # ── Validation ────────────────────────────────────────────────────────────
  #
  # All of these are fast and need no toolchain, container or hardware. They are
  # the gate that runs on every push, because everything downstream is an
  # expensive place to discover a typo.

  validate:
    desc: Run every fast check (this is the pre-push gate)
    deps: [validate-static, check-packages, check-c]

  validate-static:
    desc: Run the fast checks that need no toolchain
    deps: [check-boards, check-shell]

  check-packages:
    desc: Verify every Alpine package name this project installs really exists
    cmds:
      - ./alpine/boards/check-packages.sh

  check-boards:
    desc: Validate trait registry, kernel configs and firmware blobs
    cmds:
      - ./alpine/boards/check-boards.sh

  check-shell:
    desc: Shellcheck the scripts this repo owns
    cmds:
      - |
        set -eu
        shellcheck -s sh \
          alpine/boards/gentraits.sh \
          alpine/boards/check-boards.sh \
          alpine/boards/check-packages.sh \
          alpine/scripts/build.sh \
          alpine/scripts/post-build.sh \
          alpine/scripts/system-image.sh \
          alpine/image/build.sh

  check-c:
    desc: Run C code quality checks on workspace/alpine (complexity <= 10, cppcheck, clang-format)
    deps: [check-complexity, check-cppcheck, check-format]

  check-complexity:
    desc: Ensure cyclomatic complexity in workspace/alpine is <= 10
    cmds:
      - lizard -C 10 -w workspace/alpine

  check-cppcheck:
    desc: Run cppcheck static analysis on workspace/alpine
    cmds:
      - cppcheck --enable=warning,performance,portability --error-exitcode=1 -DPLATFORM=\"alpine\" -D__has_feature\(x\)=0 -I workspace/alpine/platform -I workspace/alpine/libmsettings -I workspace/all/common --suppress=missingIncludeSystem --suppress=unknownMacro workspace/alpine

  check-format:
    desc: Check C code formatting with clang-format
    cmds:
      - sh -c 'files=$(find workspace/alpine -name "*.c" -o -name "*.h"); if [ -n "$files" ]; then clang-format --dry-run --Werror $files; fi'

  # ── Payload (NextUI) ──────────────────────────────────────────────────────
  #
  # Compiling NextUI for the alpine platform, then assembling and zipping the
  # SD-card payload. This does NOT go through NextUI's top-level makefile: that
  # hardcodes its platform list, has no `alpine` branch in `system`, and its
  # makefile.toolchain pulls ghcr.io/loveretro/alpine-toolchain which does not
  # exist. alpine/Makefile drives it instead, in our own container.
  #
  # NextUI's *component* makefiles under workspace/all/ are still used,
  # unchanged, as leaf compilers -- they resolve $(PLATFORM) generically.

  payload:
    desc: Compile the NextUI payload for the alpine platform
    cmds:
      - '{{.MAKE}} -C alpine payload'

  payload-components:
    desc: Compile only the payload binaries (no assembly, no zip)
    cmds:
      - '{{.MAKE}} -C alpine payload-components'

  system:
    desc: Assemble the compiled payload into build/
    cmds:
      - '{{.MAKE}} -C alpine system'

  package:
    desc: Zip build/ into releases/*.zip for the image stage
    cmds:
      - '{{.MAKE}} -C alpine package'

  clean:
    desc: Clean payload, image and release artifacts
    cmds:
      - '{{.MAKE}} -C alpine clean'

  name:
    desc: Print the release name this build would produce
    cmds:
      - '{{.MAKE}} name'

  # ── Image (Alpine) ────────────────────────────────────────────────────────
  #
  # Two stages, deliberately separate:
  #   components  kernel + rootfs. Slow (~30min/board), no NextUI involved.
  #   image       genimage packaging. Fast, and needs the NextUI payload, so it
  #               depends on `task payload`.
  # Splitting them means a kernel rebuild is not triggered by a UI change, and
  # an image can be rebuilt without podman.

  components:
    desc: Build the kernel and rootfs for a board (BOARD=h700|rk3566)
    vars:
      BOARD: '{{.BOARD | default .BOARDS_1}}'
    cmds:
      - |
        set -eu
        echo "board: {{.BOARD}}"
        {{.MAKE}} -C alpine components BOARD={{.BOARD}}

  image:
    desc: Package the flashable .img.zst (BOARD=h700|rk3566)
    vars:
      BOARD: '{{.BOARD | default .BOARDS_1}}'
    cmds:
      - |
        set -eu
        release=$({{.MAKE}} name | tail -1)
        echo "board: {{.BOARD}}  release: $release"
        NEXTUI_RELEASE="$release" {{.MAKE}} -C alpine image BOARD={{.BOARD}}

  image-all:
    desc: Build kernel, rootfs and image for every supported board
    cmds:
      - |
        set -eu
        for b in {{.BOARDS}}; do
          echo "=== $b ==="
          {{.MAKE}} -C alpine components BOARD=$b
          release=$({{.MAKE}} name | tail -1)
          NEXTUI_RELEASE="$release" {{.MAKE}} -C alpine image BOARD=$b
        done

  builder:
    desc: Build the Alpine builder container image locally
    cmds:
      - '{{.MAKE}} -C alpine builder'

  # ── build: the one command that produces an image ─────────────────────────
  #
  # This is the top of the stack and the only thing most people need to run.
  # It drives the two trees in the only order that works:
  #
  #   1. builder     the Alpine foundation's toolchain container
  #   2. components  alpine/ -- kernel, DTBs, rootfs. Foundation only, no NextUI.
  #   3. payload     workspace/alpine/ -- the NextUI platform port compiled for
  #                   the foundation we just built
  #   4. image       alpine/ -- genimage packaging, stitching the payload onto
  #                   the rootfs
  #
  # The payload has to come after components and the image after the payload,
  # because the image stage copies the payload zip onto the SD-card image and
  # the payload links against the exact musl/mesa the rootfs was built with.
  #
  # BOARD=<name> builds one board; no BOARD builds every supported board.
  # Pass --skip-builder to reuse an existing builder image (it is unchanged
  # unless alpine/container/ or alpine/packages.txt changed).

  build:
    desc: Build a flashable image (foundation + NextUI payload). BOARD=<name> for one board
    cmds:
      - |
        set -eu
        skip_builder=0
        for arg in "$@"; do
          case "$arg" in
          --skip-builder) skip_builder=1 ;;
          *) echo "unknown option: $arg" >&2; exit 2 ;;
          esac
        done

        if [ "$skip_builder" -eq 0 ]; then
          echo "==> [1/4] builder container"
          {{.MAKE}} -C alpine builder
        else
          echo "==> [1/4] builder container (skipped)"
        fi

        for b in {{if .BOARD}}{{.BOARD}}{{else}}{{.BOARDS}}{{end}}; do
          echo "==> [2/4] foundation: kernel + rootfs ($b)"
          {{.MAKE}} -C alpine components BOARD="$b"

          echo "==> [3/4] port: NextUI payload for alpine"
          {{.MAKE}} -C alpine payload

          echo "==> [4/4] image: packaging ($b)"
          release=$({{.MAKE}} name | tail -1)
          NEXTUI_RELEASE="$release" {{.MAKE}} -C alpine image BOARD="$b"
        done

  # ── Device operations ─────────────────────────────────────────────────────

  shell:
    desc: 'TODO: open a shell on a connected device'
    cmds:
      - |
        echo "not implemented yet: device access comes with the image build." >&2
        exit 1
