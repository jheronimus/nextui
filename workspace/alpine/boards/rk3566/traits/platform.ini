# NextUI RK3566 platform traits (SoC-wide defaults).
# Any key may be overridden at device level (see devices/*.ini).
#
# Imported verbatim from Minime's packages/components/boards/rk3566/traits/platform.ini.
# One deliberate change of substance, none of syntax: upstream appends a second
# `gpu_driver=` line in post-build to switch between Alpine and Buildroot, which
# makes this file emit the key twice and rely on last-wins merging. This fork is
# Alpine-only, so the key is declared here exactly once and nothing appends to it.

[screen]
screen_backlight_path=/sys/class/backlight/backlight/brightness
screen_backlight_max=255
# fb0/blank tears down the whole display pipeline and leaves the DSI panel
# black on wake; bl_power only kills the backlight (matches upstream rgb30).
screen_blank_path=/sys/class/backlight/backlight/bl_power

[cpu]
cpu_governor_path=/sys/devices/system/cpu/cpufreq/policy0/scaling_governor
cpu_clock_path=/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq
cpu_thermal_path=/sys/class/thermal/thermal_zone0/temp

[gpu]
gpu_device=/dev/fb0
gpu_driver=panfrost
gpu_clock_min=400000000
gpu_clock_max=800000000

[audio]
audio_card=default
audio_mixer=Master
audio_jack_device_name=rk817_ext Headphones

[input]
input_gamepad_device_name=gpio-keys-control
input_menu_device_name=adc-keys
input_power_device_name=rk805 pwrkey
input_volume_device_name=gpio-keys-vol
input_lid_device_name=na
input_rumble_device_name=pwm-vibrator
key_up=544
key_down=545
key_left=546
key_right=547
key_a=305
key_b=304
key_c=na
key_x=307
key_y=308
key_z=na
key_l1=310
key_r1=311
key_l2=312
key_r2=313
key_l3=317
key_r3=318
key_start=315
key_select=314
key_menu=316
key_power=116
key_vol_up=115
key_vol_down=114

input_axis_lx_invert=0
input_axis_ly_invert=0
input_axis_rx_invert=0
input_axis_ry_invert=0


[power]
power_battery_sysfs=/sys/class/power_supply/battery
power_charger_online_path=/sys/class/power_supply/rk817-charger/online
power_led_path=/sys/class/leds/green:power/brightness

[usb]
usb_otg=1
usb_host_ports=0
usb_device_mode=1
usb_controller_mode=0


[storage]
storage_sd_node=/dev/mmcblk0
storage_sd2_node=na
storage_emmc_node=na
