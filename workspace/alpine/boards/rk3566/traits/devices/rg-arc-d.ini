[match]
model=Anbernic RG ARC-D
compatible=anbernic,rg-arc-d

[device]
device_id=rg-arc-d
device_model=Anbernic RG ARC-D

[screen]
screen_width=640
screen_height=480
screen_rotation=90
screen_aspect=4:3
screen_refresh_rate=60

[gpu]
gpu_hdmi_connector=HDMI-A-1

[input]
input_stick_device_name=na
input_axis_lx=na
input_axis_ly=na
input_axis_rx=na
input_axis_ry=na
input_axis_min=na
input_axis_center=na
input_axis_max=na
key_a=305
key_b=304
key_c=306
key_x=307
key_y=308
key_z=309
key_l3=na
key_r3=na
input_touch=1
input_touch_device_name=Goodix Capacitive TouchScreen

[wireless]
wifi_interface=wlan0
bluetooth_interface=hci0

[storage]
storage_emmc_node=/dev/mmcblk1
storage_sd2_node=na
