[match]
model=Anbernic RG35XX SP
compatible=anbernic,rg35xx-sp

[device]
device_id=rg35xx-sp-v1
device_model=Anbernic RG35XX SP

[screen]
screen_width=640
screen_height=480
screen_rotation=0
screen_aspect=4:3
screen_refresh_rate=60

[gpu]
gpu_hdmi_connector=HDMI-A-1

[input]
input_stick_device_name=na
# Clamshell: lid switch is exposed as a gpio-keys evdev device.
input_lid_device_name=gpio-keys-lid
input_axis_lx=na
input_axis_ly=na
input_axis_rx=na
input_axis_ry=na
input_axis_min=na
input_axis_center=na
input_axis_max=na
input_touch=0

[wireless]
wifi_interface=wlan0
bluetooth_interface=hci0

# Core device mirroring the mainline sun50i-h700-anbernic-rg35xx-sp.dts
# (the SP rev1 panel). The mainline DTB is shipped as-is.
[dts]
dtb=allwinner/sun50i-h700-anbernic-rg35xx-sp
