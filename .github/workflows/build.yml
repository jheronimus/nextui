---
name: Build & Release NextUI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - 'alpine/**'
      - 'workspace/alpine/**'
      - 'Taskfile.yml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'alpine/**'
      - 'workspace/alpine/**'
      - 'Taskfile.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      kernel:
        description: Force a kernel rebuild
        type: boolean
        default: false
      publish_release:
        description: Publish as GitHub Release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.53.1

      - name: Install shellcheck
        run: |
          set -euo pipefail
          ver=0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${ver}/shellcheck-v${ver}.linux.aarch64.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-v${ver}/shellcheck
          shellcheck --version

      - name: Install C quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format python3-pip
          pip install --break-system-packages lizard

      - name: Check package names
        run: task check-packages

      - name: Validate
        run: task validate

  build:
    name: Build ${{ matrix.board }}
    needs: validate
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        board: [h700, rk3566]
    env:
      BOARD: ${{ matrix.board }}
      FORCE_KERNEL_REBUILD: ${{ github.event.inputs.kernel == 'true' && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.53.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/alpine-dl
          key: alpine-${{ runner.arch }}-${{ hashFiles('alpine/**/APKBUILD', 'alpine/boards/*/tiny-*.config') }}
          restore-keys: |
            alpine-${{ runner.arch }}-

      - name: Build
        run: task build BOARD=${{ matrix.board }}

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: nextui-alpine-${{ matrix.board }}
          path: |
            alpine/out/${{ matrix.board }}/*.img.zst
            alpine/out/${{ matrix.board }}/*.tar.zst
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: release-tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nextui-alpine-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: |
            dist/*.img.zst
            dist/*.tar.zst
          generate_release_notes: true
          make_latest: "true"
