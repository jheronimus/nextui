---
# Build the Alpine image for every supported board.
#
# Named alpine-*.yml because that is the one path outside alpine/ where
# we are allowed to add files: GitHub only reads workflows from the repo root,
# and upstream NextUI has no file by this name, so a future upstream release can
# never conflict with it. alpine/check-upstream.sh enforces both
# halves of that rule and runs first.
#
# Runner: ubuntu-24.04-arm. This is the whole reason the build has no
# cross-toolchain stage -- the runner is already aarch64, the target is aarch64,
# and the payload is compiled natively inside the aarch64 musl container. No
# qemu, no emulation. On an x86 runner the same Makefile would add
# --platform linux/arm64 and pay the emulation cost instead.

name: Alpine image

on:
  push:
    branches: ["**"]
    paths:
      - 'alpine/**'
      - 'workspace/alpine/**'
      - 'Taskfile.yml'
      - '.github/workflows/alpine-*.yml'
  pull_request:
    paths:
      - 'alpine/**'
      - 'workspace/alpine/**'
      - 'Taskfile.yml'
      - '.github/workflows/alpine-*.yml'
  workflow_dispatch:
    inputs:
      board:
        description: Board to build (blank = all)
        required: false
        default: ''
      kernel:
        description: Force a kernel rebuild
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alpine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0 # check-upstream.sh diffs against the v6.14.0 tag

      # fetch-depth: 0 brings history but not reliably tags, and the base tag is
      # an absolute requirement for the whole upstream check. Fetch every tag
      # rather than naming v6.14.0 here, so the script stays the single source of
      # truth for which base it diffs against and the two cannot drift.
      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.53.1

      # Pin shellcheck. The distro package drifts (Ubuntu 24.04 ships 0.9.0,
      # local dev is often much newer) and the two disagree on severity
      # classification, so an unpinned `apt-get install shellcheck` makes CI
      # fail on findings that never reproduce locally.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          ver=0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${ver}/shellcheck-v${ver}.linux.aarch64.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-v${ver}/shellcheck
          shellcheck --version

      # Runs before the expensive build: a wrong package name otherwise only
      # shows up minutes into a container build, on the runner.
      - name: Check package names
        run: task check-packages

      - name: Validate
        run: task validate

  build:
    name: Build ${{ matrix.board }}
    needs: validate
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        board: [h700, rk3566]
    env:
      BOARD: ${{ matrix.board }}
      FORCE_KERNEL_REBUILD: ${{ inputs.kernel && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.53.1

      - name: Free disk space
        # The kernel tree plus a rootfs needs more room than a fresh runner has.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      # hashFiles and runner are only available in step contexts, never in a
      # workflow- or job-level `env` block. Referencing them there fails
      # validation and the run dies with no jobs created, which is a needlessly
      # confusing failure to debug.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/alpine-dl
          key: alpine-${{ runner.arch }}-${{ hashFiles('alpine/**/APKBUILD', 'alpine/boards/*/tiny-*.config') }}
          restore-keys: |
            alpine-${{ runner.arch }}-

      # One task, not four steps. CI should exercise exactly the path a person
      # runs locally, otherwise the two drift and CI stops proving anything.
      #
      # This is the long step: ~30min/board cold, much quicker once ccache and
      # the downloaded sources are restored above. It runs the whole chain --
      # builder, then alpine/ (kernel + rootfs), then workspace/alpine/ (the
      # NextUI port compiled against that rootfs), then genimage packaging.
      - name: Build
        run: task build BOARD=${{ matrix.board }}

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: nextui-alpine-${{ matrix.board }}
          path: |
            alpine/out/${{ matrix.board }}/*.img.zst
            alpine/out/${{ matrix.board }}/*.tar.zst
          if-no-files-found: error
          retention-days: 14
