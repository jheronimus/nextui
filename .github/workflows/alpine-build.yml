---
# Build the Alpine image for every supported board.
#
# Named alpine-*.yml because that is the one path outside workspace/alpine/ where
# we are allowed to add files: GitHub only reads workflows from the repo root,
# and upstream NextUI has no file by this name, so a future upstream release can
# never conflict with it. workspace/alpine/boards/check-upstream.sh enforces both
# halves of that rule and runs first.
#
# Runner: ubuntu-24.04-arm. This is the whole reason the build has no
# cross-toolchain stage -- the runner is already aarch64, the target is aarch64,
# and the payload is compiled natively inside the aarch64 musl container. No
# qemu, no emulation. On an x86 runner the same Makefile would add
# --platform linux/arm64 and pay the emulation cost instead.

name: Alpine image

on:
  push:
    branches: ["**"]
    paths:
      - 'workspace/alpine/**'
      - 'Taskfile.yml'
      - '.github/workflows/alpine-*.yml'
  pull_request:
    paths:
      - 'workspace/alpine/**'
      - 'Taskfile.yml'
      - '.github/workflows/alpine-*.yml'
  workflow_dispatch:
    inputs:
      board:
        description: Board to build (blank = all)
        required: false
        default: ''
      kernel:
        description: Force a kernel rebuild
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alpine-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where the build writes. Mounted into the container.
  ALPINE_WORK: /home/runner/alpine
  # Cache the kernel tarball + ccache between runs; both are large and slow.
  CACHE_KEY: alpine-${{ runner.arch }}-${{ hashFiles('workspace/alpine/**/APKBUILD', 'workspace/alpine/boards/*/tiny-*.config') }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0 # check-upstream.sh diffs against the v6.14.0 tag

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.53.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate
        run: task validate

  build:
    name: Build ${{ matrix.board }}
    needs: validate
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        board: [h700, rk3566]
    env:
      BOARD: ${{ matrix.board }}
      FORCE_KERNEL_REBUILD: ${{ inputs.kernel && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.53.1

      - name: Free disk space
        # The kernel tree plus a rootfs needs more room than a fresh runner has.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/alpine-dl
          key: ${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_KEY }}-

      - name: Build the builder container
        run: task builder

      # Kernel + rootfs. The long step (~30min/board cold, ccache makes rebuilds
      # far quicker). Split from `payload` so a UI change does not re-trigger it.
      - name: Build components
        run: task components BOARD=${{ matrix.board }}

      # NextUI itself, compiled natively in the same container.
      - name: Build payload
        run: task payload

      - name: Package image
        run: task image BOARD=${{ matrix.board }}

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: nextui-alpine-${{ matrix.board }}
          path: workspace/alpine/out/${{ matrix.board }}/*.img.zst
          if-no-files-found: error
          retention-days: 14
