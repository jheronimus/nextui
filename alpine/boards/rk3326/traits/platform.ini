# Minime RK3326 platform traits (SoC-wide defaults).
# Any key may be overridden at device level (see devices/*.ini).

[screen]
screen_backlight_path=/sys/class/backlight/backlight/brightness
screen_backlight_max=32
screen_blank_path=/sys/class/graphics/fb0/blank

[cpu]
cpu_governor_path=/sys/devices/system/cpu/cpufreq/policy0/scaling_governor
cpu_clock_path=/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq
cpu_thermal_path=/sys/class/thermal/thermal_zone0/temp

[gpu]
gpu_device=/dev/fb0
gpu_driver=panfrost
gpu_clock_min=na
gpu_clock_max=na

[audio]
audio_card=default
audio_mixer=Line Out
audio_jack_device_name=na

[input]
input_gamepad_device_name=gpio-keys
input_power_device_name=rk805 pwrkey
input_volume_device_name=gpio-keys-volume
input_lid_device_name=na
input_rumble_device_name=pwm-vibrator
key_up=544
key_down=545
key_left=546
key_right=547
key_a=305
key_b=304
key_c=na
key_x=307
key_y=308
key_z=na
key_l1=310
key_r1=311
key_l2=312
key_r2=313
key_l3=317
key_r3=318
key_start=315
key_select=314
key_menu=316
key_power=116
key_vol_up=115
key_vol_down=114

input_axis_lx_invert=0
input_axis_ly_invert=0
input_axis_rx_invert=0
input_axis_ry_invert=0


[power]
power_battery_sysfs=/sys/class/power_supply/battery
power_charger_online_path=na
power_led_path=na

[usb]
usb_otg=1
usb_host_ports=0
usb_device_mode=1
usb_controller_mode=0


[storage]
storage_sd_node=/dev/mmcblk0
storage_sd2_node=na
storage_emmc_node=na
