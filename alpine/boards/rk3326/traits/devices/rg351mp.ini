bluetooth_interface=na

# Derived from the mainline RG351M DTSi: identity + 3.5" 640x480 panel.
[dts]
base=rk3326-anbernic-rg351m.dtsi
panel=anbernic,rg351v-panel newvision,nv3051d
panel_supply=vdd:vcc_lcd