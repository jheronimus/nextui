[match]
model=Anbernic RG351V
compatible=anbernic,rg351v

[device]
device_id=rg351v
device_model=Anbernic RG351V

[screen]
screen_width=640
screen_height=480
# Vertical body with a 640x480 panel: the UI must rotate the landscape
# content to display upright (mainline DTS sets no panel rotation, so the
# kernel rotates nothing here). Exact direction (90 vs 270) to be confirmed
# on-device with `remote screenshot --raw`.
screen_rotation=90
screen_aspect=4:3
screen_refresh_rate=60

[gpu]
gpu_hdmi_connector=na

[input]
input_stick_device_name=adc-joystick
input_volume_device_name=gpio-keys-vol
input_axis_lx=0
input_axis_ly=1
input_axis_rx=na
input_axis_ry=na
input_axis_min=0
input_axis_center=2048
input_axis_max=4096
input_touch=0

[wireless]
wifi_interface=wlan0
bluetooth_interface=na
