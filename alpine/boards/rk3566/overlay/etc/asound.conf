# Route the ALSA default PCM and control to the RK817 analog codec.
# RK3566 boards probe the sound cards as HDMI (card 0) then the RK817 codec
# (card 1); the default PCM would otherwise be the sinkless HDMI output.
pcm.!default {
    type plug
    slave.pcm "hw:1,0"
}
ctl.!default {
    type hw
    card 1
}

# Dynamic overrides (Bluetooth audio, USB audio)
@hooks [
    {
        func load
        files [
            "/run/asoundrc"
            "/mnt/sdcard/.asoundrc"
        ]
        errors false
    }
]
